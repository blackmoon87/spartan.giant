<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Shop Stack — From Infrastructure to Storefront</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;max-width:100%;overflow-x:hidden}
img,video,canvas,svg{max-width:100%;height:auto;display:block}

:root{
  --font-stack:'Poppins',system-ui,sans-serif;
  --r:16px;
  --r-sm:10px;
  --gap-row:6px;
  --bg:#EDE7DD;
  --ground:#C9C2B4;
  --ink:#2B2620;
  --shadow-strong:rgba(30,24,14,0.35);
  --shadow-light:rgba(30,24,14,0.10);
  --highlight:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%);
  --ex-bg:#DAD4C8;
  --ex-text:#4a4536;
  --c1:#6B3FA0;
  --c2:#2F5FA8;
  --c3:#1E8E8E;
  --c4:#3E9142;
  --c5:#D6A417;
  --c6:#D9722A;
  --c7:#B23A3A;
}

body{
  font-family:var(--font-stack);
  background:var(--bg);
  color:var(--ink);
  padding:48px 20px 80px;
  -webkit-font-smoothing:antialiased;
}

.iso-ground{
  max-width:920px;
  margin:0 auto;
}

.stack-header{
  text-align:center;
  max-width:640px;
  margin:0 auto 56px;
}

.stack-header .eyebrow{
  font-size:15px;
  letter-spacing:0.02em;
  color:#8a7a5c;
  margin-bottom:6px;
}

.stack-header h1{
  font-size:clamp(32px,5vw,48px);
  margin:0 0 14px;
  font-weight:800;
}

.stack-header p{
  font-size:17px;
  line-height:1.5;
  color:#55503f;
}

.iso-stack{
  display:flex;
  flex-direction:column;
  gap:var(--gap-row);
}

.layer-row{
  display:grid;
  grid-template-columns:90px 1fr 200px;
  gap:var(--gap-row);
  align-items:stretch;
}

.num-tile{
  background:var(--color);
  border-radius:var(--r);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:42px;
  font-weight:800;
  box-shadow:2px 2px 0 var(--shadow-strong);
  background-image:var(--highlight);
}

.main-block{
  background:var(--color);
  border-radius:var(--r);
  padding:18px 22px;
  box-shadow:2px 2px 0 var(--shadow-strong);
  background-image:var(--highlight);
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:10px;
}

.block-title{
  color:#fff;
  font-size:22px;
  font-weight:800;
  letter-spacing:0.01em;
  margin:0;
}

.block-desc{
  color:rgba(255,255,255,0.9);
  font-size:14px;
  line-height:1.4;
  margin:0;
  max-width:46ch;
}

.icon-tray{
  background:rgba(0,0,0,0.14);
  border-radius:var(--r-sm);
  padding:8px 12px;
  display:flex;
  gap:14px;
  align-items:center;
  width:fit-content;
}

.icon-tray span{
  font-size:22px;
  filter:drop-shadow(1px 2px 0 rgba(0,0,0,0.25));
}

.ex-tile{
  background:var(--ex-bg);
  border-radius:var(--r);
  padding:16px 18px;
  box-shadow:2px 2px 0 var(--shadow-light);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.ex-label{
  color:var(--color);
  font-weight:800;
  font-size:13px;
  margin:0 0 6px;
}

.ex-list{
  font-size:13px;
  color:var(--ex-text);
  line-height:1.5;
  margin:0;
}

.base-plate{
  max-width:920px;
  margin:10px auto 0;
  background:var(--ground);
  border-radius:20px;
  height:46px;
  box-shadow:2px 2px 0 rgba(30,24,14,0.15);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  letter-spacing:0.08em;
  color:#6b6350;
}

*:focus-visible{
  outline:3px solid var(--c2);
  outline-offset:3px;
}

@media(max-width:992px){
  .layer-row{
    grid-template-columns:60px 1fr;
    grid-template-areas:
      "num main"
      "ex ex";
  }
  .num-tile{grid-area:num;font-size:28px;border-radius:12px}
  .main-block{grid-area:main;border-radius:12px;padding:14px 16px}
  .ex-tile{grid-area:ex;border-radius:12px}
}

@media(max-width:576px){
  .layer-row{
    grid-template-columns:1fr;
    grid-template-areas:
      "num"
      "main"
      "ex";
  }
  .num-tile{
    width:52px;
    height:52px;
    font-size:24px;
    justify-self:start;
  }
  .icon-tray{
    flex-wrap:wrap;
  }
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:0s !important;
    transition-duration:0s !important;
  }
}
</style>
</head>
<body>

<div class="iso-ground">

  <header class="stack-header">
    <div class="eyebrow">7 layers</div>
    <h1>The Shop Stack</h1>
    <p>Every great e-commerce platform is a stack of specialized layers. Here's what powers a modern online shop, from infrastructure to storefront.</p>
  </header>

  <div class="iso-stack" id="stack"></div>
  <div class="base-plate">BUILT &amp; SHIPPED — ONE LAYER AT A TIME</div>

</div>

<script>
var layers = [
  {
    title: 'STOREFRONT',
    description: 'Customer-facing UI rendered server-side with XSS-safe Blade templates, responsive layouts, and accessible navigation.',
    icons: ['\uD83D\uDDA5\uFE0F', '\uD83C\uDFA8', '\uD83D\uDCC4'],
    examples: ['Product Pages', 'Cart View', 'Checkout Form', 'Search']
  },
  {
    title: 'AUTH & SECURITY',
    description: 'User login, session management, CSRF protection, RBAC role gates, and hardened cookie handling.',
    icons: ['\uD83D\uDD12', '\uD83D\uDEE1\uFE0F', '\uD83D\uDD11'],
    examples: ['Login / Register', 'CSRF Tokens', 'Role Gates', 'Sessions']
  },
  {
    title: 'PRODUCT CATALOG',
    description: 'Product models, category trees, faceted search, variant management, and eager-loaded relations.',
    icons: ['\uD83C\uDFF7\uFE0F', '\uD83D\uDD0D', '\uD83D\uDCE6'],
    examples: ['Categories', 'SKU Lookup', 'Faceted Search', 'Variants']
  },
  {
    title: 'CART & CHECKOUT',
    description: 'Shopping cart state, coupon engine, payment gateway integration, and atomic order transactions.',
    icons: ['\uD83D\uDED2', '\uD83D\uDCB3', '\uD83E\uDDFE'],
    examples: ['Add to Cart', 'Stripe / PayPal', 'Coupons', 'Order Review']
  },
  {
    title: 'INVENTORY & FULFILLMENT',
    description: 'Stock tracking, warehouse allocation, shipping rate calculation, and dispatch event triggers.',
    icons: ['\uD83D\uDCE6', '\uD83D\uDE9A', '\uD83C\uDFED'],
    examples: ['Stock Sync', 'Shipment Tracking', 'Warehousing', 'Returns']
  },
  {
    title: 'ANALYTICS & REPORTING',
    description: 'Sales dashboards, conversion funnels, customer lifetime value metrics, and revenue aggregation.',
    icons: ['\uD83D\uDCCA', '\uD83D\uDCC8', '\uD83D\uDC65'],
    examples: ['Sales Reports', 'Funnel Analysis', 'Customer LTV', 'A/B Tests']
  },
  {
    title: 'INFRASTRUCTURE',
    description: 'MySQL via QueryBuilder, tagged Redis cache, async job queue, log rotation, and OPcache tuning.',
    icons: ['\uD83D\uDDC4\uFE0F', '\u26A1', '\uD83D\uDD27'],
    examples: ['MySQL / SQLite', 'Redis Cache', 'Job Queue', 'Health Checks']
  }
];

function renderLayerStack(layers) {
  var colors = ['c1','c2','c3','c4','c5','c6','c7'];
  var total = layers.length;
  return layers.map(function(layer, i) {
    var c = colors[i % colors.length];
    var num = total - i;
    return '<div class="layer-row" style="--color:var(--' + c + ')">' +
      '<div class="num-tile">' + num + '</div>' +
      '<div class="main-block">' +
        '<p class="block-title">' + layer.title + '</p>' +
        '<p class="block-desc">' + layer.description + '</p>' +
        '<div class="icon-tray">' + layer.icons.map(function(ic) { return '<span>' + ic + '</span>'; }).join('') + '</div>' +
      '</div>' +
      '<div class="ex-tile">' +
        '<p class="ex-label">Examples:</p>' +
        '<p class="ex-list">' + layer.examples.join(', ') + '</p>' +
      '</div>' +
    '</div>';
  }).join('');
}

document.getElementById('stack').innerHTML = renderLayerStack(layers);
</script>
</body>
</html>
